<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Per-page tags (title, description, robots, canonical, Open Graph, page JSON-LD).
       Replaced for every route at build time by scripts/prerender.mjs; these are the home defaults. -->
  <!--route-head-->
  <title>Custom Software Development Company India | Monolith Codes</title>
  <meta name="description" content="Founder-led custom software development company in India. Websites from $999, web apps and SaaS from $2,499, ERP/CRM and AI. 100% IP ownership. Get a quote." />
  <!--/route-head-->

  <meta name="author" content="MONOLITH CODES" />
  <meta name="application-name" content="MONOLITH CODES" />
  <meta name="apple-mobile-web-app-title" content="MONOLITH CODES" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#080A0C" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />

  <!-- Icons & manifest -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="alternate" type="text/plain" title="LLM summary" href="/llms.txt" />
  <link rel="author" href="/humans.txt" />

  <!-- Self-hosted primary font (latin) — preloaded to avoid late text swap -->
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Social (site-wide) -->
  <meta property="og:site_name" content="MONOLITH CODES" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:locale:alternate" content="en_GB" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- First-visit home intro: keep the prerendered page hidden until the intro screen mounts (no flash).
       Safety net: always reveal after 4s even if JavaScript fails. -->
  <style>html.mc-intro-pending #root{visibility:hidden}</style>

  <!-- Anti-flash theme script (System is the default). Its SHA-256 is pinned in the CSP (vercel.json);
       scripts/prerender.mjs fails the build if they drift apart. -->
  <script>(function(){try{var d=document.documentElement,s=localStorage.getItem('monolith_theme'),t=s==='light'||s==='dark'||s==='system'?s:'system',r=t==='system'?(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;d.setAttribute('data-theme',r);d.style.colorScheme=r;var p=location.pathname;if((p==='/'||p==='/index.html')&&!sessionStorage.getItem('mc_intro_played')){d.classList.add('mc-intro-pending');setTimeout(function(){d.classList.remove('mc-intro-pending')},4000)}}catch(e){}})();</script>

  <!-- No-JS visitors: animated elements are prerendered in their hidden start state — show them. -->
  <noscript><style>#root [style*="opacity:0"]{opacity:1!important;transform:none!important;filter:none!important}</style></noscript>
</head>

<body class="bg-mc-bg text-mc-text antialiased selection:bg-mc-orange selection:text-mc-bg">
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
